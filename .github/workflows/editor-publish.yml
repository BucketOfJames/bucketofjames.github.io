name: Editor Publish (Signed)

on:
  repository_dispatch:
    types: [editor-publish]

permissions:
  contents: write
  issues: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.EDITOR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.EDITOR_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Apply staged content and push (GPG-signed)
        env:
          MSG: ${{ github.event.client_payload.msg }}
        run: |
          set -e
          git fetch origin editor-staging
          git checkout FETCH_HEAD -- index.html
          git add index.html
          git commit -S -m "${MSG:-Update site content from editor}" || echo "Nothing to commit — content already on main."
          git push || { git pull --rebase origin main && git push; }

      - name: Open issue on failure
        if: failure()
        run: |
          gh issue create \
            --title "Editor publish failed" \
            --body "The editor publish workflow failed at $(date -u). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label editor-publish || true